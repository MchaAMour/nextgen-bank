name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make check

  postgres:
    # Row locks, PL/pgSQL triggers and concurrent-allocation tests run only here (PG-01).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-postgres
