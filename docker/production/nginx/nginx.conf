user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access_log main;

    sendfile on;

    keepalive_timeout 65;

    # The edge Caddy terminates TLS and reaches this server over the radian-edge
    # Docker network. Keep the client address and scheme Caddy saw.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    proxy_pass_header X-Django-User;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;
        error_log /var/log/nginx/error.log error;

        location /api/v1/ {
            proxy_pass http://api;
            access_log /var/log/nginx/api_access.log;
            error_log /var/log/nginx/api_error.log error;
        }

        # Stripe Checkout return pages.
        location /payments/ {
            proxy_pass http://api;
            access_log /var/log/nginx/api_access.log;
        }

        # Must match ADMIN_URL.
        location /supersecret {
            proxy_pass http://api;
            access_log /var/log/nginx/admin_access.log;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }
}
