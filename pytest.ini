[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = core_apps
addopts = -ra -p no:cacheprovider
filterwarnings =
    # ReportLab's own code under Python 3.12 (OBS-01); remove when ReportLab is upgraded.
    ignore:ast.NameConstant is deprecated:DeprecationWarning:reportlab.lib.rl_safe_eval
