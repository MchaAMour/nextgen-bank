# Demo production stack: runs on the same server as the local stack, behind the
# shared edge Caddy, which terminates TLS and proxies next-gen-bank.<domain> to
# nginx on the radian-edge network. Only Caddy publishes public ports; the two
# ports below bind to 127.0.0.1 and are reached over an SSH tunnel.
#
# Settings and secrets live outside the repository, in /srv/next-gen-bank/.env.production
# (see docs/DEPLOYMENT.md). Start with: make prod-up
name: next-gen-bank

x-env: &env
    env_file:
        - /srv/next-gen-bank/.env.production

services:
    api: &api
        build:
            context: .
            dockerfile: ./docker/production/django/Dockerfile
        image: next-gen-bank-django
        <<: *env
        volumes:
            - static_volume:/app/staticfiles
            - app_logs:/app/logs
        expose:
            - "8000"
        depends_on:
            - postgres
            - redis
            - rabbitmq
        command: /start.sh
        restart: unless-stopped
        networks:
            - internal

    postgres:
        build:
            context: .
            dockerfile: ./docker/production/postgres/Dockerfile
        <<: *env
        volumes:
            - banker_prod_db:/var/lib/postgresql/data
            - ./backups:/backups
        restart: unless-stopped
        networks:
            - internal

    redis:
        image: redis:7.0-alpine3.19
        command: redis-server --appendonly yes
        volumes:
            - redis_data:/data
        restart: unless-stopped
        networks:
            - internal

    rabbitmq:
        image: rabbitmq:3-management
        # RABBITMQ_DEFAULT_USER/PASS; applied only when the data volume is first created.
        <<: *env
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - rabbitmq_log:/var/log/rabbitmq
        restart: unless-stopped
        networks:
            - internal

    celeryworker:
        <<: *api
        command: /start-celeryworker.sh

    celerybeat:
        <<: *api
        command: /start-celerybeat.sh

    flower:
        <<: *api
        ports:
            - "127.0.0.1:5556:5555"
        volumes:
            - flower_db:/app/flower_db
        command: /start-flower.sh

    # A demo has no real mail provider: Mailpit catches every email (web UI on the tunnel port).
    mailpit:
        image: docker.io/axllent/mailpit:v1.20.3
        ports:
            - "127.0.0.1:8026:8025"
        volumes:
            - mailpit_db:/data
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATA_FILE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        restart: unless-stopped
        networks:
            - internal

    nginx:
        build:
            context: ./docker/production/nginx
            dockerfile: Dockerfile
        restart: unless-stopped
        volumes:
            - ./docker/production/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - static_volume:/app/staticfiles
            - logs_store:/var/log/nginx
        depends_on:
            - api
        networks:
            internal:
            radian-edge:
                aliases:
                    - next-gen-bank-web

networks:
    internal:
    # The edge Caddy's network (created by /srv/radian/caddy).
    radian-edge:
        external: true

volumes:
    banker_prod_db:
    static_volume:
    app_logs:
    logs_store:
    redis_data:
    rabbitmq_data:
    rabbitmq_log:
    flower_db:
    mailpit_db:
